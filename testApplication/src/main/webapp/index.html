<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test GET / POST</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f7f7f7;
        }
        .card {
            max-width: 520px;
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        h1 {
            margin-top: 0;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        form {
            margin: 0;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            cursor: pointer;
            font-size: 16px;
        }
        .get-btn {
            background: #2563eb;
            color: white;
        }
        .post-btn {
            background: #16a34a;
            color: white;
        }
        .hint {
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Test du même URL avec GET et POST</h1>
        <p class="hint">
            Le bouton GET appelle <strong>/test</strong> en GET.
            Le bouton POST appelle <strong>/test</strong> en POST.
        </p>
        <div class="actions">
            <form action="test" method="get">
                <button class="get-btn" type="submit">Appeler GET</button>
            </form>
            <form action="test" method="post">
                <button class="post-btn" type="submit">Appeler POST</button>
            </form>
        </div>
    </div>
</body>
</html>
